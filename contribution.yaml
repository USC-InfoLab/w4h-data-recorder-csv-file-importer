# Test contract + live-run sample for this module.
# Automated tests and in-app Run / ./run.sh use the tiny synthetic fixtures
# below. They follow Empatica E4 headers from these public datasets — do not
# copy those downloads into git:
#   https://www.kaggle.com/datasets/priyankraval/nurse-stress-prediction-wearable-sensors
#   https://www.kaggle.com/datasets/mahdiesoltani/galaxyppg
#   https://www.kaggle.com/datasets/omprakashyadav45/pain-prediction-dataset-emphatica-e4
#   https://www.empatica.com/blog/decoding-wearable-sensor-signals-what-to-expect-from-your-e4-data/

slug: w4h-data-recorder-csv-file-importer
kind: ingest
publisher: usc-infolab

tests:
  automated:
    command: pytest tests/ -q -m "not integration"
    sample:
      kind: fixtures
      path: tests/fixtures

  live:
    command: ./run.sh import
    sample:
      kind: fixtures
      path: tests/fixtures
      files:
        - hr.csv
        - eda.csv
        - temp.csv
        - acc.csv
        - merged_physiology.csv

inputs:
  - key: dataset_id
    type: dataset
    create: empty
  - key: dataset_title
    type: text
    default: Data recorder file-importer test
    override: true
  - key: files
    type: files
    required: false
    summary: Empatica E4 recorder files. Connect exports or headered research CSVs.
